services:
  gtfs-api:
    build: .
    image: gtfs-stop-timetable-api:latest
    container_name: gtfs-api
    ports:
      - "8000:8000"
    environment:
      GTFS_DB_PATH: /data/gtfs.db
      GTFS_MAX_UPLOAD_BYTES: "268435456"
    volumes:
      - gtfs-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  gtfs-data:
